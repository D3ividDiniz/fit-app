<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
		/>
		<meta name="theme-color" content="#f7f7f7" />
		<title>Dabliu.fit — Master</title>
		<style>
			:root {
				--bg: #f7f7f7;
				--surface: #fff;
				--surface2: #eee;
				--surface3: #e5e5e5;
				--text: #101010;
				--muted: #666;
				--faint: #929292;
				--line: #ddd;
				--accent: #2563eb;
				--accentSoft: color-mix(in srgb, var(--accent) 12%, white);
				--danger: #c62828;
				--nav: 66px;
				--max: 820px;
				--r: 16px;
				--font: -apple-system, BlinkMacSystemFont, "SF Pro Display",
					"SF Pro Text", Inter, Arial, sans-serif;
			}
			html.dark {
				--bg: #090909;
				--surface: #111;
				--surface2: #191919;
				--surface3: #232323;
				--text: #f5f5f5;
				--muted: #aaa;
				--faint: #777;
				--line: #292929;
				--accentSoft: color-mix(in srgb, var(--accent) 18%, #111);
			}
			* {
				box-sizing: border-box;
				-webkit-tap-highlight-color: transparent;
			}
			html,
			body,
			#app {
				margin: 0;
				min-height: 100%;
				background: var(--bg);
				color: var(--text);
				font-family: var(--font);
				-webkit-font-smoothing: antialiased;
			}
			button,
			input,
			select,
			textarea {
				font: inherit;
			}
			button {
				border: 0;
				color: inherit;
				cursor: pointer;
			}
			input,
			select,
			textarea {
				width: 100%;
				background: var(--surface);
				color: var(--text);
				border: 1px solid var(--line);
				border-radius: 11px;
				padding: 13px;
				outline: 0;
			}
			input:focus,
			select:focus,
			textarea:focus {
				border-color: var(--accent);
				box-shadow: 0 0 0 3px var(--accentSoft);
			}
			textarea {
				min-height: 100px;
				resize: vertical;
			}
			.shell {
				min-height: 100vh;
			}
			.header {
				position: sticky;
				top: 0;
				z-index: 50;
				background: color-mix(in srgb, var(--bg) 92%, transparent);
				backdrop-filter: blur(18px);
				border-bottom: 1px solid var(--line);
			}
			.head {
				max-width: var(--max);
				margin: auto;
				min-height: var(--nav);
				padding: 10px 17px;
				display: flex;
				align-items: center;
				justify-content: space-between;
			}
			.logo {
				font-weight: 900;
				font-size: 21px;
				letter-spacing: -0.8px;
				background: none;
			}
			.logo i {
				font-style: normal;
				color: var(--accent);
			}
			.actions {
				display: flex;
				gap: 7px;
			}
			.icon {
				width: 41px;
				height: 41px;
				border-radius: 12px;
				background: var(--surface);
				border: 1px solid var(--line);
				display: grid;
				place-items: center;
			}
			.nav {
				max-width: var(--max);
				margin: auto;
				display: flex;
				gap: 5px;
				overflow: auto;
				padding: 6px 12px;
				scrollbar-width: none;
			}
			.nav::-webkit-scrollbar {
				display: none;
			}
			.nav button {
				flex: 0 0 auto;
				padding: 9px 12px;
				border-radius: 10px;
				background: transparent;
				color: var(--muted);
				font-size: 13px;
				font-weight: 750;
			}
			.nav button.on {
				background: var(--surface);
				color: var(--text);
				border: 1px solid var(--line);
			}
			.page {
				width: min(100%, var(--max));
				margin: auto;
				padding: 25px 17px calc(100px + env(safe-area-inset-bottom));
			}
			.hero {
				margin-bottom: 18px;
			}
			.eyebrow {
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.1em;
				font-weight: 850;
				color: var(--faint);
			}
			h1 {
				font-size: clamp(34px, 9vw, 52px);
				line-height: 0.98;
				letter-spacing: -2px;
				margin: 6px 0 10px;
			}
			h2 {
				font-size: 26px;
				letter-spacing: -1px;
				line-height: 1.05;
				margin: 0;
			}
			h3 {
				font-size: 18px;
				margin: 0;
			}
			.muted {
				color: var(--muted);
			}
			.small {
				font-size: 13px;
			}
			.tiny {
				font-size: 11px;
			}
			.stack {
				display: flex;
				flex-direction: column;
				gap: 12px;
			}
			.row {
				display: flex;
				align-items: center;
				gap: 9px;
			}
			.between {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
			}
			.grid2 {
				display: grid;
				grid-template-columns: repeat(2, 1fr);
				gap: 10px;
			}
			.grid3 {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 9px;
			}
			.card {
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: var(--r);
				padding: 18px;
				box-shadow: 0 5px 25px rgba(0, 0, 0, 0.035);
			}
			.flat {
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: 14px;
				padding: 15px;
			}
			.btn {
				min-height: 46px;
				border-radius: 12px;
				padding: 0 15px;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
				font-weight: 800;
			}
			.primary {
				background: var(--accent);
				color: #fff;
			}
			.secondary {
				background: var(--surface);
				border: 1px solid var(--line);
			}
			.soft {
				background: var(--accentSoft);
				color: var(--accent);
			}
			.ghost {
				background: transparent;
				color: var(--muted);
			}
			.danger {
				background: #fae9e9;
				color: var(--danger);
			}
			.block {
				width: 100%;
			}
			.large {
				min-height: 56px;
				font-size: 16px;
			}
			.sm {
				min-height: 37px;
				padding: 0 11px;
				font-size: 12px;
			}
			.badge {
				display: inline-flex;
				align-items: center;
				min-height: 27px;
				padding: 0 9px;
				border-radius: 999px;
				background: var(--surface2);
				font-size: 11px;
				font-weight: 800;
				color: var(--muted);
			}
			.badge.accent {
				background: var(--accentSoft);
				color: var(--accent);
			}
			.statv {
				font-size: 27px;
				font-weight: 900;
				letter-spacing: -1px;
			}
			.statl {
				font-size: 11px;
				color: var(--faint);
			}
			.divider {
				height: 1px;
				background: var(--line);
				margin: 4px 0;
			}
			.search {
				position: relative;
			}
			.search span {
				position: absolute;
				left: 14px;
				top: 50%;
				transform: translateY(-50%);
				color: var(--faint);
			}
			.search input {
				padding-left: 42px;
			}
			.tabs {
				display: flex;
				gap: 6px;
				overflow: auto;
				scrollbar-width: none;
			}
			.tabs::-webkit-scrollbar {
				display: none;
			}
			.tabs button {
				flex: 0 0 auto;
				padding: 9px 12px;
				border-radius: 10px;
				background: var(--surface);
				border: 1px solid var(--line);
				color: var(--muted);
				font-size: 12px;
				font-weight: 800;
			}
			.tabs button.on {
				border-color: var(--accent);
				background: var(--accentSoft);
				color: var(--accent);
			}
			/* workout */
			.workoutTop {
				display: flex;
				justify-content: space-between;
				gap: 12px;
				align-items: flex-start;
			}
			.clock {
				font-variant-numeric: tabular-nums;
				background: var(--surface);
				border: 1px solid var(--line);
				padding: 8px 10px;
				border-radius: 10px;
				font-weight: 850;
			}
			.progress {
				height: 6px;
				background: var(--surface3);
				border-radius: 99px;
				overflow: hidden;
				margin: 14px 0;
			}
			.progress > i {
				display: block;
				height: 100%;
				background: var(--accent);
				border-radius: inherit;
			}
			.exName {
				font-size: clamp(31px, 9vw, 46px);
				font-weight: 900;
				letter-spacing: -2px;
				line-height: 0.98;
				margin-top: 5px;
			}
			.setTitle {
				font-size: 18px;
				font-weight: 850;
				margin-top: 21px;
			}
			.setGrid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 9px;
				margin-top: 10px;
			}
			.bigInput {
				font-size: 26px;
				font-weight: 900;
				min-height: 62px;
			}
			.label {
				display: block;
				font-size: 10px;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				color: var(--muted);
				font-weight: 850;
				margin-bottom: 6px;
			}
			.historyRows {
				display: flex;
				flex-direction: column;
				gap: 6px;
				margin-top: 14px;
			}
			.setRow {
				display: grid;
				grid-template-columns: 36px 1fr 1fr auto;
				gap: 8px;
				align-items: center;
				padding: 10px;
				border-radius: 10px;
				background: var(--surface2);
				font-size: 13px;
			}
			.rest {
				position: sticky;
				bottom: 9px;
				z-index: 20;
				margin-top: 12px;
				padding: 15px;
				background: color-mix(in srgb, var(--surface) 94%, transparent);
				border: 1px solid var(--line);
				border-radius: 15px;
				box-shadow: 0 12px 35px rgba(0, 0, 0, 0.14);
				backdrop-filter: blur(16px);
			}
			.restTime {
				font-size: 38px;
				font-weight: 900;
				font-variant-numeric: tabular-nums;
				letter-spacing: -1px;
			}
			.restActions {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 7px;
				margin-top: 9px;
			}
			/* lists */
			.list {
				display: flex;
				flex-direction: column;
				gap: 8px;
			}
			.item {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				padding: 14px;
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: 13px;
			}
			.itemMain {
				min-width: 0;
			}
			.itemName {
				font-weight: 820;
			}
			.itemSub {
				font-size: 12px;
				color: var(--muted);
				margin-top: 3px;
			}
			.empty {
				text-align: center;
				padding: 35px 12px;
				color: var(--muted);
			}
			.empty b {
				display: block;
				color: var(--text);
				font-size: 17px;
				margin-bottom: 4px;
			}
			.week {
				display: flex;
				flex-direction: column;
				gap: 7px;
			}
			.dayrow {
				display: grid;
				grid-template-columns: 54px 1fr auto;
				align-items: center;
				gap: 9px;
				padding: 13px;
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: 12px;
			}
			.day {
				font-size: 11px;
				font-weight: 900;
			}
			.dayname {
				font-weight: 750;
				font-size: 14px;
			}
			.dayrest {
				color: var(--faint);
			}
			/* charts */
			.bars {
				height: 145px;
				display: flex;
				align-items: flex-end;
				gap: 7px;
				margin-top: 15px;
			}
			.barCol {
				flex: 1;
				min-width: 0;
				text-align: center;
			}
			.bar {
				width: 100%;
				min-height: 3px;
				background: var(--accent);
				border-radius: 5px 5px 2px 2px;
			}
			.barLabel {
				font-size: 9px;
				color: var(--faint);
				margin-top: 5px;
			}
			.metric {
				font-size: 22px;
				font-weight: 900;
			}
			.metricLabel {
				font-size: 11px;
				color: var(--muted);
			}
			/* onboarding */
			.onboard {
				min-height: 100vh;
				padding: 30px 22px max(25px, env(safe-area-inset-bottom));
				display: flex;
			}
			.onboardInner {
				width: min(100%, 540px);
				margin: auto;
				display: flex;
				flex-direction: column;
				gap: 23px;
			}
			.onboardLogo {
				font-size: 31px;
				font-weight: 950;
				letter-spacing: -1.5px;
			}
			.onboardLogo i {
				font-style: normal;
				color: var(--accent);
			}
			.onboard h1 {
				font-size: clamp(40px, 11vw, 64px);
			}
			.onboard p {
				font-size: 18px;
				line-height: 1.45;
				color: var(--muted);
			}
			.dots {
				display: flex;
				gap: 5px;
			}
			.dot {
				height: 5px;
				width: 25px;
				border-radius: 9px;
				background: var(--surface3);
			}
			.dot.on {
				background: var(--accent);
			}
			/* modal */
			.backdrop {
				position: fixed;
				inset: 0;
				z-index: 200;
				background: rgba(0, 0, 0, 0.46);
				display: flex;
				align-items: flex-end;
				justify-content: center;
				padding: 10px;
			}
			.modal {
				width: min(100%, 650px);
				max-height: calc(100vh - 20px);
				overflow: auto;
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: 21px 21px 14px 14px;
				padding: 20px;
			}
			.handle {
				height: 4px;
				width: 42px;
				background: var(--line);
				border-radius: 99px;
				margin: -6px auto 17px;
			}
			.modalTitle {
				font-size: 25px;
				font-weight: 900;
				letter-spacing: -1px;
			}
			.modalActions {
				display: flex;
				gap: 8px;
				margin-top: 17px;
			}
			.modalActions > * {
				flex: 1;
			}
			.toast {
				position: fixed;
				z-index: 500;
				left: 50%;
				bottom: calc(20px + env(safe-area-inset-bottom));
				transform: translate(-50%, 20px);
				opacity: 0;
				pointer-events: none;
				background: var(--text);
				color: var(--bg);
				padding: 12px 15px;
				border-radius: 12px;
				font-size: 13px;
				font-weight: 800;
				transition: 0.18s;
				width: max-content;
				max-width: calc(100% - 30px);
			}
			.toast.on {
				opacity: 1;
				transform: translate(-50%, 0);
			}
			@media (min-width: 700px) {
				.backdrop {
					align-items: center;
				}
				.modal {
					border-radius: 21px;
				}
				.page {
					padding-top: 34px;
				}
			}
		</style>
	</head>

		<div id="app"></div>
		<div id="modal"></div>
		<div id="toast" class="toast"></div>

				function editSet(id) {

					modal(
						`<div class="modalTitle">Corrigir série</div><div class="small muted" style="margin-top:6px">Você pode corrigir carga, repetições e RPE sem perder o histórico.</div><div class="setGrid" style="margin-top:14px"><div><label class="label">Carga</label><input id="editW" type="number" step="0.5" value="${esc(

				function saveEdit(id) {
					let r = s.active?.sets.find((x) => x.id === id);

						!Number.isFinite(w) ||
						w < 0 ||
						!Number.isFinite(reps) ||
						reps <= 0
					)
						return toast("Valores inválidos.");
					r.weight = w;
					r.reps = reps;
					let best = s.active.sets
						.filter((x) => x.exerciseId === r.exerciseId)
						.sort(
							(a, b) => b.weight * b.reps - a.weight * a.reps
						)[0];
					let old = s.active.sets
						.filter((x) => x.exerciseId === r.exerciseId)
						.sort(
							(a, b) => b.weight * b.reps - a.weight * a.reps
						)[0];
					if (best)
						s.prs[r.exerciseId] = {
							exerciseId: r.exerciseId,
							weight: best.weight,
							reps: best.reps,
							at: best.at,
						};

				function finish(useNow = true) {
					if (!s.active) return;
					let a = s.active,
						w = currentWorkout();
					let last = a.sets.length
						? a.sets[a.sets.length - 1].at
						: Date.now();
					let end = useNow ? Date.now() : last;
					let rec = {
						id: a.id,
						name: w.name,
						workoutId: w.id,
						startedAt: a.startedAt,
						finishedAt: end,
						duration: Math.max(
							0,
							Math.floor((end - a.startedAt) / 1000)
						),
						sets: [...a.sets],
						skipped: [...a.skipped],
						notes: a.notes,
					};
					s.history.unshift(rec);
					s.active = null;
					s.screen = "history";
					save();
					closeModal();
					render();
					toast("Treino registrado.");
				}
				function start(id) {
					if (s.active) {
						modal(
							`<div class="modalTitle">Treino em andamento</div><div class="muted" style="margin-top:6px">Existe uma sessão preservada. Descartar significa perder apenas a sessão ainda não finalizada.</div><div class="modalActions"><button class="btn secondary" data-a="closeModal">Continuar</button><button class="btn danger" data-a="discardStart" data-id="${id}">Descartar e iniciar</button></div>`
						);
						return;
					}
					s.active = {
						id: uid(),
						workoutId: id,
						startedAt: Date.now(),
						exercise: 0,
						set: 0,
						sets: [],
						skipped: [],
						draft: { weight: "", reps: "", rpe: "" },
						rest: null,
						notes: "",
					};
					s.screen = "workout";
					save();
					render();
				}
				function completionIndex(w) {
					let idx = -1;
					w.exercises.forEach((it, i) => {
						let e = ex(it.exerciseId);
						if (e?.type !== "cardio") idx = i;
					});
					return idx;
				}
				function completeSet() {
					let a = s.active,
						w = currentWorkout(),
						item = w.exercises[a.exercise],
						e = ex(item.exerciseId),
						weight = Number(document.getElementById("wgt")?.value),
						reps = Number(document.getElementById("rps")?.value),
						rraw = document.getElementById("rpe")?.value,
						rpe = rraw === "" ? null : Number(rraw);
					a.draft = {
						weight: String(
							document.getElementById("wgt")?.value || ""
						),
						reps: String(
							document.getElementById("rps")?.value || ""
						),
						rpe: String(rraw || ""),
					};
					a.notes =
						document.getElementById("notes")?.value || a.notes;
					if (!Number.isFinite(weight) || weight < 0)
						return toast("Informe uma carga válida.");
					if (!Number.isFinite(reps) || reps <= 0)
						return toast("Informe as repetições.");
					let rec = {
						id: uid(),
						exerciseId: e.id,
						exerciseName: e.name,
						number: a.set + 1,
						weight,
						reps,
						rpe,
						at: Date.now(),
					};
					a.sets.push(rec);
					let p = s.prs[e.id];
					if (!p || weight * reps > p.weight * p.reps)
						s.prs[e.id] = {
							exerciseId: e.id,
							weight,
							reps,
							at: rec.at,
						};
					a.draft = { weight: "", reps: "", rpe: "" };
					if (a.set + 1 < item.sets) {
						a.set++;
						a.rest = { startedAt: Date.now(), target: item.rest };
					} else {
						a.set = 0;
						a.rest = null;
						let ci = completionIndex(w);
						a.exercise = Math.min(
							w.exercises.length - 1,
							a.exercise + 1
						);
						if (a.exercise === ci + 1 && ci >= 0) {
							let last =
								a.sets
									.filter((x) => x.exerciseId === e.id)
									.sort((x, y) => y.at - x.at)[0]?.at ||
								Date.now();
							let diff = Math.floor((Date.now() - last) / 1000);
							modal(
								`<div class="modalTitle">Treino concluído.</div><div class="muted" style="margin-top:6px">A última série válida foi registrada. ${
									diff >= 180
										? "Você demorou mais de 3 minutos para encerrar. Use a última série como horário do treino ou registre o horário atual."
										: "Escolha se o término deve usar a última série ou agora."
								}</div><div class="modalActions"><button class="btn secondary" data-a="finishLast">${
									diff >= 180
										? "Usar última série"
										: "Última série"
								}</button><button class="btn primary" data-a="finishNow">Agora</button></div>`
							);
						}
					}
					save();
					render();
				}

						document.getElementById("rps")?.value ||
						s.active.draft.reps;

						document.getElementById("rpe")?.value ||

				function bindInputs() {
					document
						.querySelectorAll("input,textarea,select")
						.forEach((e) => {
							e.oninput = () => {
								if (e.id === "eq") {
									s.ui.query = e.value;
									save();
									render();
								}
								if (
									e.id === "wgt" ||
									e.id === "rps" ||
									e.id === "rpe"
								) {
									sync();
								}
								if (e.id === "notes") sync();
							};
						});
				}
				function saveSettings() {
					let r = Number(
							document.getElementById("defaultRest").value
						),
						e = Number(document.getElementById("exec").value);
					if (r >= 0) s.settings.defaultRest = r;
					if (e >= 0) s.settings.execSeconds = e;
					save();
					render();
					toast("Configurações salvas.");
				}
				function saveSchedule() {
					document
						.querySelectorAll("[data-day]")
						.forEach(
							(x) => (s.schedule[x.dataset.day] = x.value || null)
						);
					save();
					render();
					toast("Agenda salva.");
				}
				function handle(el) {
					let a = el.dataset.a;
					if (!a) return;
					switch (a) {
						case "go":
							s.screen = el.dataset.screen;
							save();
							render();
							break;
						case "resume":
							s.screen = "workout";
							render();
							break;
						case "start":
							closeModal();
							start(el.dataset.id);
							break;
						case "skip":
							s.ui.skipDate = dateKey();
							s.ui.todayOverride = null;
							save();
							render();
							toast("Treino pulado hoje.");
							break;
						case "replace":
							replace();
							break;
						case "replaceWith":
							s.ui.todayOverride = el.dataset.id;
							s.ui.todayOverrideDate = dateKey();
							s.ui.skipDate = null;
							s.screen = "home";
							closeModal();
							save();
							toast("Treino substituído para hoje.");
							render();
							break;
						case "tab":
							s.ui.tab = el.dataset.tab;
							save();
							render();
							break;
						case "cat":
							s.ui.cat = el.dataset.cat;
							save();
							render();
							break;
						case "details":
							details(el.dataset.id);
							break;
						case "exercise":
							exerciseDetails(el.dataset.id);
							break;
						case "editSet":
							editSet(el.dataset.id);
							break;
						case "saveEdit":
							saveEdit(el.dataset.id);
							break;
						case "hist":
							historyDetails(el.dataset.id);
							break;
						case "set":
							sync();
							completeSet();
							break;
						case "skipEx":
							skipEx();
							break;
						case "prev":
							prev();
							break;
						case "addRest":
							if (s.active?.rest) s.active.rest.target += 30;
							save();
							render();
							break;
						case "stopRest":
							if (s.active) s.active.rest = null;
							save();
							render();
							break;
						case "finish":
							sync();
							{
								let last =
										s.active?.sets
											?.slice()
											.sort((a, b) => b.at - a.at)[0]
											?.at ||
										s.active?.startedAt ||
										Date.now(),
									diff = Math.floor(
										(Date.now() - last) / 1000
									);
								modal(
									`<div class="modalTitle">Finalizar treino?</div><div class="muted" style="margin-top:6px">${
										diff >= 180
											? "A última série foi registrada há " +
											  fmt(diff) +
											  ". Se você esqueceu de finalizar, usar a última série preserva melhor a evolução."
											: "Escolha como calcular o horário final."
									}</div><div class="modalActions"><button class="btn secondary" data-a="finishLast">Usar última série</button><button class="btn primary" data-a="finishNow">Agora</button></div>`
								);
							}
							break;
						case "finishLast":
							finish(false);
							break;
						case "finishNow":
							finish(true);
							break;
						case "theme":
							s.settings.theme =
								s.settings.theme === "dark" ? "light" : "dark";
							save();
							render();
							break;
						case "accent":
							s.settings.accent = el.dataset.color;
							save();
							render();
							break;
						case "accentOnboard":
							s.settings.accent = el.dataset.color;
							save();
							render();
							break;
						case "saveTrain":
							saveSettings();
							break;
						case "saveSchedule":
							saveSchedule();
							break;
						case "import":
							s.screen = "import";
							save();
							render();
							break;
						case "export":
							exportData();
							break;
						case "reset":
							reset();
							break;
						case "confirmReset":
							localStorage.removeItem(KEY);
							s = initial();
							closeModal();
							render();
							toast("Dados apagados.");
							break;
						case "newWorkout":
							newWorkout();
							break;
						case "addDraft":
							addDraft();
							break;
						case "pickDraft":
							s.ui.draft.exercises.push({
								id: uid(),
								exerciseId: el.dataset.id,
								sets: 3,
								reps: 10,
								rest: s.settings.defaultRest,
							});
							save();
							renderNewWorkout();
							break;
						case "removeDraft":
							s.ui.draft.exercises.splice(
								Number(el.dataset.i),
								1
							);
							save();
							renderNewWorkout();
							break;
						case "saveWorkout":
							saveNewWorkout();
							break;
						case "closeModal":
							closeModal();
							break;
						case "discardStart":
							s.active = null;
							closeModal();
							start(el.dataset.id);
							break;
						case "copyPrompt":
							navigator.clipboard
								?.writeText(
									"Analise os screenshots enviados e extraia somente dados visíveis do meu histórico de treino. Não invente valores. Estruture: data, início, término, duração, treino, exercício, série, peso, repetições, RPE e observações. Se algo não estiver visível, deixe vazio. Apresente os registros para conferência antes de qualquer importação."
								)
								.then(() => toast("Prompt copiado."));
							break;
						case "onboardNext":
							if ((s.ui.onboard || 0) < 4) {
								s.ui.onboard++;
								save();
								render();
							} else {
								s.first = false;
								s.screen = "home";
								save();
								render();
							}
							break;
					}
				}
				document.addEventListener("click", (e) => {
					let x = e.target.closest("[data-a]");
					if (x) handle(x);
				});
				document.addEventListener("visibilitychange", () => {
					if (s.active) {
						sync();
						s.active.lastSeen = Date.now();
						save();
					}
				});
				window.addEventListener("pagehide", () => {
					sync();
					save();
				});
				function saveNewWorkout() {
					let d = s.ui.draft;
					if (!d?.exercises.length)
						return toast("Adicione exercícios.");
					d.name = document.getElementById("nwName")?.value.trim();
					d.desc = document.getElementById("nwDesc")?.value.trim();
					if (!d.name) return toast("Dê um nome ao treino.");
					s.workouts.push({
						id: uid(),
						name: d.name,
						desc: d.desc || "",
						preset: false,
						exercises: d.exercises,
					});
					delete s.ui.draft;
					save();
					closeModal();
					render();
					toast("Treino criado.");
				}
				function exportData() {
					let b = new Blob([JSON.stringify(s, null, 2)], {
							type: "application/json",
						}),
						u = URL.createObjectURL(b),
						a = document.createElement("a");
					a.href = u;
					a.download = "dabliu-fit-backup.json";
					a.click();
					URL.revokeObjectURL(u);
					toast("Backup exportado.");
				}
				function reset() {
					modal(
						`<div class="modalTitle">Apagar tudo?</div><div class="muted" style="margin-top:6px">Isso remove histórico, PRs, agenda, treinos personalizados e configurações locais.</div><div class="modalActions"><button class="btn secondary" data-a="closeModal">Cancelar</button><button class="btn danger" data-a="confirmReset">Apagar</button></div>`
					);
				}
				let timer = setInterval(() => {
					if (s.active && s.screen === "workout") {
						let a = document.getElementById("workClock");
						if (a) a.textContent = fmt(elapsed());
						let r = document.getElementById("restClock");
						if (r) r.textContent = fmt(restElapsed());
					}
				}, 500);
				if (s.active) s.screen = "workout";
				render();
			})();
		</script>
	</body>
</html>
</html>
