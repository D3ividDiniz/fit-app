<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
>

<meta name="theme-color" content="#ffffff">

<title>Dabliu.fit</title>

<style>
/* =========================================================
   DABLIU.FIT
   Single-file fitness application
   ========================================================= */

:root {
  --bg: #f7f7f7;
  --surface: #ffffff;
  --surface-2: #f0f0f0;
  --surface-3: #e8e8e8;

  --text: #111111;
  --text-2: #555555;
  --text-3: #888888;

  --border: #dedede;
  --border-strong: #c9c9c9;

  --accent: #2563eb;
  --accent-soft: color-mix(in srgb, var(--accent) 12%, white);
  --accent-strong: color-mix(in srgb, var(--accent) 82%, black);

  --success: #222222;
  --danger: #c62828;
  --warning: #9a6700;

  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 22px;

  --nav-height: 68px;
  --max-width: 760px;

  --font:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    Inter,
    Helvetica,
    Arial,
    sans-serif;

  --shadow:
    0 1px 2px rgba(0,0,0,.05),
    0 6px 24px rgba(0,0,0,.04);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  min-height: 100%;
  background: var(--bg);
  color-scheme: light;
}

html.dark {
  color-scheme: dark;

  --bg: #090909;
  --surface: #111111;
  --surface-2: #191919;
  --surface-3: #222222;

  --text: #f5f5f5;
  --text-2: #b7b7b7;
  --text-3: #777777;

  --border: #292929;
  --border-strong: #3a3a3a;

  --accent-soft: color-mix(in srgb, var(--accent) 18%, #111111);
}

body {
  margin: 0;
  min-height: 100vh;

  background: var(--bg);
  color: var(--text);

  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;

  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
  color: inherit;
}

button:disabled {
  opacity: .45;
  cursor: default;
}

input,
textarea,
select {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 14px 15px;
  outline: none;
}

input:focus,
textarea:focus,
select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

textarea {
  min-height: 110px;
  resize: vertical;
}

a {
  color: inherit;
}

/* =========================================================
   APP SHELL
   ========================================================= */

#app {
  min-height: 100vh;
}

.app-shell {
  min-height: 100vh;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 50;

  background:
    color-mix(in srgb, var(--bg) 92%, transparent);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  border-bottom: 1px solid var(--border);
}

.header-inner {
  max-width: var(--max-width);
  margin: 0 auto;

  min-height: var(--nav-height);

  padding:
    max(10px, env(safe-area-inset-top))
    18px
    10px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -.7px;
}

.brand span {
  color: var(--accent);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 7px;
}

.icon-button {
  width: 42px;
  height: 42px;

  border-radius: 50%;

  background: var(--surface);
  border: 1px solid var(--border);

  display: grid;
  place-items: center;

  font-size: 19px;
}

.icon-button:active {
  transform: scale(.96);
}

.main {
  width: 100%;
}

.page {
  width: min(100%, var(--max-width));
  margin: 0 auto;

  padding:
    24px
    18px
    calc(110px + env(safe-area-inset-bottom));
}

/* =========================================================
   TOP NAV
   ========================================================= */

.top-nav {
  max-width: var(--max-width);
  margin: 0 auto;

  display: flex;
  gap: 4px;

  overflow-x: auto;

  padding: 7px 14px;

  scrollbar-width: none;
}

.top-nav::-webkit-scrollbar {
  display: none;
}

.nav-item {
  flex: 0 0 auto;

  min-height: 38px;

  padding: 0 13px;

  border-radius: 11px;

  background: transparent;
  color: var(--text-2);

  font-size: 14px;
  font-weight: 650;
}

.nav-item.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

/* =========================================================
   TYPOGRAPHY
   ========================================================= */

.eyebrow {
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .09em;
  color: var(--text-3);
}

h1 {
  margin: 5px 0 10px;

  font-size: clamp(32px, 8vw, 46px);
  line-height: .98;
  letter-spacing: -1.8px;
}

h2 {
  margin: 0;

  font-size: 26px;
  line-height: 1.05;
  letter-spacing: -1px;
}

h3 {
  margin: 0;

  font-size: 19px;
  line-height: 1.1;
  letter-spacing: -.4px;
}

p {
  margin: 0;
}

.muted {
  color: var(--text-2);
}

.small {
  font-size: 13px;
}

.tiny {
  font-size: 11px;
}

/* =========================================================
   LAYOUT
   ========================================================= */

.stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.stack-sm {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.row-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.spacer {
  height: 10px;
}

/* =========================================================
   CARDS
   ========================================================= */

.card {
  background: var(--surface);

  border: 1px solid var(--border);

  border-radius: var(--radius);

  padding: 18px;

  box-shadow: var(--shadow);
}

.card-flat {
  background: var(--surface);

  border: 1px solid var(--border);

  border-radius: var(--radius);

  padding: 16px;
}

.card-title {
  font-weight: 760;
  font-size: 17px;
}

.card-subtitle {
  margin-top: 4px;
  color: var(--text-2);
  font-size: 14px;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.btn {
  min-height: 48px;

  border-radius: 13px;

  padding: 0 17px;

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;

  font-weight: 750;

  transition:
    transform .12s ease,
    background .12s ease,
    opacity .12s ease;
}

.btn:active {
  transform: scale(.98);
}

.btn-primary {
  background: var(--accent);
  color: #fff;
}

.btn-secondary {
  background: var(--surface);
  border: 1px solid var(--border);
}

.btn-soft {
  background: var(--accent-soft);
  color: var(--accent);
}

.btn-dark {
  background: var(--text);
  color: var(--bg);
}

.btn-danger {
  background: #fceaea;
  color: var(--danger);
}

html.dark .btn-danger {
  background: #341717;
}

.btn-ghost {
  background: transparent;
  color: var(--text-2);
}

.btn-block {
  width: 100%;
}

.btn-large {
  min-height: 58px;
  font-size: 17px;
}

.btn-small {
  min-height: 38px;
  padding: 0 12px;
  font-size: 13px;
}

.button-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.button-row.three {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

/* =========================================================
   HOME
   ========================================================= */

.hero {
  padding: 8px 0 14px;
}

.hero-date {
  color: var(--text-2);
  font-size: 14px;
}

.today-workout {
  display: flex;
  flex-direction: column;
  gap: 17px;
}

.workout-title {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -1px;
}

.workout-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.badge {
  display: inline-flex;
  align-items: center;

  min-height: 28px;

  padding: 0 9px;

  border-radius: 999px;

  background: var(--surface-2);
  color: var(--text-2);

  font-size: 12px;
  font-weight: 700;
}

.badge.accent {
  color: var(--accent);
  background: var(--accent-soft);
}

.stat {
  min-width: 0;
}

.stat-value {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -1px;
}

.stat-label {
  font-size: 12px;
  color: var(--text-3);
}

/* =========================================================
   WORKOUT EXECUTION
   ========================================================= */

.workout-page {
  padding-top: 16px;
}

.workout-header {
  display: flex;
  flex-direction: column;
  gap: 10px;

  margin-bottom: 18px;
}

.workout-header-line {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.workout-timer {
  flex: 0 0 auto;

  padding: 8px 11px;

  border-radius: 10px;

  background: var(--surface);
  border: 1px solid var(--border);

  font-variant-numeric: tabular-nums;

  font-size: 16px;
  font-weight: 800;
}

.progress-track {
  height: 7px;

  border-radius: 999px;

  background: var(--surface-3);

  overflow: hidden;
}

.progress-fill {
  height: 100%;

  width: 0;

  background: var(--accent);

  border-radius: inherit;

  transition: width .2s ease;
}

.exercise-card {
  padding: 20px;
}

.exercise-category {
  color: var(--accent);

  font-size: 12px;
  font-weight: 800;

  text-transform: uppercase;
  letter-spacing: .08em;
}

.exercise-name {
  margin-top: 5px;

  font-size: clamp(29px, 8vw, 42px);
  font-weight: 850;

  letter-spacing: -1.7px;
  line-height: 1;
}

.exercise-description {
  margin-top: 10px;

  color: var(--text-2);

  font-size: 14px;
}

.set-counter {
  margin-top: 20px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.set-number {
  font-size: 18px;
  font-weight: 800;
}

.set-status {
  color: var(--text-2);
  font-size: 13px;
}

.input-big {
  font-size: 28px;
  font-weight: 800;

  min-height: 62px;
}

.rep-input {
  font-size: 28px;
  font-weight: 800;

  min-height: 62px;
}

.field-label {
  display: block;

  margin-bottom: 7px;

  font-size: 12px;
  font-weight: 800;

  color: var(--text-2);

  text-transform: uppercase;
  letter-spacing: .06em;
}

.set-form {
  margin-top: 17px;

  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.set-history {
  margin-top: 18px;

  display: flex;
  flex-direction: column;
  gap: 7px;
}

.set-row {
  display: grid;

  grid-template-columns: 42px 1fr 1fr auto;

  gap: 8px;

  align-items: center;

  padding: 11px 10px;

  border-radius: 10px;

  background: var(--surface-2);

  font-size: 14px;
}

.set-row.done {
  border-left: 3px solid var(--accent);
}

.set-index {
  color: var(--text-3);
  font-weight: 800;
}

.set-data {
  font-weight: 700;
}

.set-edit {
  width: 34px;
  height: 34px;

  border-radius: 9px;

  background: var(--surface);

  border: 1px solid var(--border);
}

/* =========================================================
   REST TIMER
   ========================================================= */

.rest-panel {
  position: sticky;
  bottom: 10px;
  z-index: 20;

  margin-top: 15px;

  padding: 16px;

  background:
    color-mix(in srgb, var(--surface) 94%, transparent);

  border: 1px solid var(--border);

  border-radius: var(--radius);

  box-shadow:
    0 10px 35px rgba(0,0,0,.12);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.rest-panel.hidden {
  display: none;
}

.rest-label {
  color: var(--text-2);

  font-size: 12px;
  font-weight: 800;

  text-transform: uppercase;
  letter-spacing: .08em;
}

.rest-time {
  margin-top: 2px;

  font-size: 38px;
  line-height: 1;

  font-weight: 850;

  font-variant-numeric: tabular-nums;

  letter-spacing: -1.5px;
}

.rest-actions {
  margin-top: 12px;

  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 8px;
}

/* =========================================================
   LIBRARY
   ========================================================= */

.search {
  position: relative;
}

.search input {
  padding-left: 43px;
}

.search-icon {
  position: absolute;

  left: 15px;
  top: 50%;

  transform: translateY(-50%);

  color: var(--text-3);
}

.segment {
  display: flex;

  overflow-x: auto;

  gap: 6px;

  scrollbar-width: none;
}

.segment::-webkit-scrollbar {
  display: none;
}

.segment button {
  flex: 0 0 auto;

  min-height: 38px;

  padding: 0 12px;

  border-radius: 10px;

  background: var(--surface);

  border: 1px solid var(--border);

  color: var(--text-2);

  font-size: 13px;
  font-weight: 700;
}

.segment button.active {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-soft);
}

.library-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.library-item {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;

  padding: 15px;

  background: var(--surface);

  border: 1px solid var(--border);

  border-radius: 14px;
}

.library-main {
  min-width: 0;
}

.library-name {
  font-size: 16px;
  font-weight: 780;
}

.library-detail {
  margin-top: 3px;

  color: var(--text-2);

  font-size: 13px;
}

.exercise-tag {
  display: inline-flex;

  margin-top: 7px;

  padding: 4px 7px;

  border-radius: 7px;

  background: var(--surface-2);

  color: var(--text-2);

  font-size: 11px;
  font-weight: 700;
}

/* =========================================================
   SCHEDULE
   ========================================================= */

.schedule-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.schedule-row {
  display: grid;

  grid-template-columns: 58px 1fr auto;

  align-items: center;

  gap: 12px;

  padding: 15px;

  background: var(--surface);

  border: 1px solid var(--border);

  border-radius: 14px;
}

.schedule-day {
  font-size: 13px;
  font-weight: 850;

  text-transform: uppercase;
}

.schedule-workout {
  min-width: 0;

  font-size: 15px;
  font-weight: 730;
}

.schedule-workout.empty {
  color: var(--text-3);
  font-weight: 500;
}

/* =========================================================
   HISTORY
   ========================================================= */

.history-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.history-item {
  background: var(--surface);

  border: 1px solid var(--border);

  border-radius: 14px;

  padding: 15px;
}

.history-date {
  font-size: 12px;
  font-weight: 800;

  color: var(--text-3);
}

.history-title {
  margin-top: 4px;

  font-size: 17px;
  font-weight: 800;
}

.history-meta {
  margin-top: 8px;

  display: flex;
  flex-wrap: wrap;

  gap: 6px;
}

/* =========================================================
   SETTINGS
   ========================================================= */

.setting-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.setting-section-title {
  margin: 5px 0 2px;

  font-size: 12px;
  font-weight: 850;

  color: var(--text-3);

  text-transform: uppercase;
  letter-spacing: .08em;
}

.setting-row {
  min-height: 58px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 15px;

  padding: 13px 15px;

  background: var(--surface);

  border: 1px solid var(--border);

  border-radius: 13px;
}

.setting-name {
  font-size: 15px;
  font-weight: 700;
}

.setting-description {
  margin-top: 2px;

  color: var(--text-2);

  font-size: 12px;
}

.setting-control {
  flex: 0 0 auto;
}

.color-grid {
  display: grid;

  grid-template-columns: repeat(4, 1fr);

  gap: 9px;

  margin-top: 10px;
}

.color-choice {
  aspect-ratio: 1;

  border-radius: 14px;

  border: 3px solid transparent;

  display: grid;
  place-items: center;

  font-size: 18px;
}

.color-choice.selected {
  border-color: var(--text);
}

/* =========================================================
   IMPORT
   ========================================================= */

.import-source-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.source-card {
  display: flex;

  align-items: center;

  gap: 13px;

  padding: 15px;

  background: var(--surface);

  border: 1px solid var(--border);

  border-radius: 14px;

  text-align: left;
}

.source-logo {
  flex: 0 0 auto;

  width: 46px;
  height: 46px;

  border-radius: 12px;

  display: grid;
  place-items: center;

  background: var(--surface-2);

  border: 1px solid var(--border);

  font-size: 17px;
  font-weight: 900;
}

.source-name {
  font-weight: 800;
}

.source-description {
  margin-top: 2px;

  color: var(--text-2);

  font-size: 12px;
}

.import-detail {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.step {
  display: grid;

  grid-template-columns: 34px 1fr;

  gap: 10px;
}

.step-number {
  width: 30px;
  height: 30px;

  border-radius: 50%;

  background: var(--accent-soft);

  color: var(--accent);

  display: grid;
  place-items: center;

  font-size: 12px;
  font-weight: 850;
}

.step-title {
  font-weight: 800;
}

.step-text {
  margin-top: 3px;

  color: var(--text-2);

  font-size: 13px;
}

.prompt-box {
  padding: 14px;

  border-radius: 12px;

  background: var(--surface-2);

  border: 1px solid var(--border);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;

  font-size: 12px;

  white-space: pre-wrap;

  user-select: text;
}

/* =========================================================
   ONBOARDING
   ========================================================= */

.onboarding {
  min-height: 100vh;

  display: flex;
  flex-direction: column;

  padding:
    max(30px, env(safe-area-inset-top))
    22px
    max(25px, env(safe-area-inset-bottom));
}

.onboarding-content {
  width: min(100%, 520px);

  margin: auto;

  display: flex;
  flex-direction: column;
  gap: 25px;
}

.onboarding-logo {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: -1.7px;
}

.onboarding-logo span {
  color: var(--accent);
}

.onboarding-number {
  color: var(--text-3);

  font-size: 13px;
  font-weight: 800;
}

.onboarding h1 {
  font-size: clamp(40px, 11vw, 64px);
}

.onboarding-copy {
  color: var(--text-2);

  font-size: 18px;

  max-width: 470px;
}

.onboarding-actions {
  margin-top: 5px;
}

/* =========================================================
   MODALS
   ========================================================= */

.modal-backdrop {
  position: fixed;

  inset: 0;

  z-index: 200;

  display: flex;
  align-items: flex-end;
  justify-content: center;

  background: rgba(0,0,0,.46);

  padding: 12px;
}

.modal-backdrop.hidden {
  display: none;
}

.modal {
  width: min(100%, 620px);

  max-height:
    calc(100vh - 24px - env(safe-area-inset-top));

  overflow: auto;

  background: var(--surface);

  border-radius: 22px 22px 15px 15px;

  border: 1px solid var(--border);

  padding: 20px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.3);
}

.modal-handle {
  width: 42px;
  height: 4px;

  margin: -7px auto 18px;

  border-radius: 999px;

  background: var(--border-strong);
}

.modal-title {
  font-size: 25px;
  font-weight: 850;

  letter-spacing: -1px;
}

.modal-actions {
  display: flex;
  gap: 8px;

  margin-top: 18px;
}

/* =========================================================
   EMPTY STATES
   ========================================================= */

.empty {
  text-align: center;

  padding: 34px 15px;

  color: var(--text-2);
}

.empty-icon {
  font-size: 31px;
  margin-bottom: 8px;
}

.empty-title {

  function uid(prefix = "id") {

  function escapeHTML(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function formatDate(timestamp) {
    if (!timestamp) return "—";

    return new Intl.DateTimeFormat(
      "pt-BR",
      {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }
    ).format(new Date(timestamp));
  }

  function formatTime(timestamp) {
    if (!timestamp) return "—";

    return new Intl.DateTimeFormat(
      "pt-BR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    ).format(new Date(timestamp));
  }

  function formatDuration(seconds) {
    seconds = Math.max(
      0,
      Math.floor(Number(seconds) || 0)
    );

    const hours = Math.floor(seconds / 3600);

    const minutes = Math.floor(
      (seconds % 3600) / 60
    );

    const secs = seconds % 60;

    if (hours > 0) {
      return (
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
      );
    }

    return (
      String(minutes).padStart(2, "0") +
      ":" +
      String(secs).padStart(2, "0")
    );
  }

  function formatDateLong(timestamp) {
    if (!timestamp) return "";

    return new Intl.DateTimeFormat(
      "pt-BR",
      {
        weekday: "long",
        day: "numeric",
        month: "long"
      }
    ).format(new Date(timestamp));
  }

        return createInitialState();
      }

      const saved = JSON.parse(raw);

      const initial = createInitialState();

      return {
        ...initial,
        ...saved,

        app: {
          ...initial.app,
          ...(saved.app || {})
        },

        settings: {
          ...initial.settings,
          ...(saved.settings || {})

          ...(saved.schedule || {})

        uiDrafts: {

          ...(saved.uiDrafts || {})

      };

    } catch (error) {
      console.error(
        "Dabliu.fit: falha ao carregar estado",
        error
      );

      return createInitialState();
    }
  }

  function saveState() {

    toastTimer = setTimeout(() => {

    if (!workout) return 0;

    let total = 0;

    workout.exercises.forEach(
      (item, index) => {

        total +=
          item.sets *
          state.settings.averageExecutionSeconds;

        if (
          index <
          workout.exercises.length - 1
        ) {
          total +=
            Math.max(
              0,
              item.sets
            ) *
            item.rest;
        }
      }
    );

    return total;
  }

  /* =======================================================
     WORKOUT ENGINE
     ======================================================= */

  function createSession(workoutId) {
    const workout =
      getWorkout(workoutId);

    if (!workout) return null;

    const session = {
      id: uid("session"),

      workoutId,

      startedAt: now(),

      lastInteractionAt: now(),

      exerciseIndex: 0,

      setIndex: 0,

      completedSets: [],

      skippedExercises: [],

      rest: null,

      notes: "",

      draft: {
        weight: "",
        reps: "",
        rpe: ""
      }
    };

    return session;
  }

  function startWorkout(workoutId) {
    if (state.activeWorkout) {
      openConfirmModal(
        "Treino em andamento",
        "Você já possui um treino em andamento. O que deseja fazer?",
        [
          {
            label: "Continuar treino",
            action: () => {
              closeModal();
              navigate("workout");
            }
          },
          {
            label: "Descartar",
            danger: true,
            action: () => {
              state.activeWorkout = null;
              saveState();

              closeModal();

              startWorkout(workoutId);
            }
          }
        ]
      );

      return;
    }

    const session =
      createSession(workoutId);

    if (!session) return;

    state.activeWorkout = session;

    saveState();

    navigate("workout");
  }

  function workoutElapsedSeconds() {
    const session =
      state.activeWorkout;

    if (!session) return 0;

    return Math.max(
      0,
      Math.floor(
        (
          now() -
          session.startedAt
        ) / 1000
      )
    );
  }

  function restElapsedSeconds() {
    const rest =
      state.activeWorkout?.rest;

    if (!rest?.startedAt) {
      return 0;
    }

    return Math.max(
      0,
      Math.floor(
        (
          now() -
          rest.startedAt
        ) / 1000
      )
    );
  }

  function startRest(seconds) {
    if (!state.activeWorkout) return;

    state.activeWorkout.rest = {
      startedAt: now(),
      targetSeconds:
        seconds ??
        state.settings.defaultRestSeconds
    };

    state.activeWorkout.lastInteractionAt =
      now();

    saveState();

    render();
  }

  function stopRest() {
    if (!state.activeWorkout) return;

    state.activeWorkout.rest = null;

    state.activeWorkout.lastInteractionAt =
      now();

    saveState();

    render();
  }

  function addRest(seconds) {
    const rest =
      state.activeWorkout?.rest;

    if (!rest) return;

    rest.targetSeconds =
      Math.max(
        0,
        rest.targetSeconds +
          seconds
      );

    saveState();

    render();
  }

  function getCurrentWorkout() {
    return getWorkout(
      state.activeWorkout?.workoutId
    );
  }

  function getCurrentExerciseItem() {
    const workout =
      getCurrentWorkout();

    if (!workout) return null;

    return workout.exercises[
      state.activeWorkout.exerciseIndex
    ];
  }

  function getCurrentExerciseDefinition() {
    const item =
      getCurrentExerciseItem();

    if (!item) return null;

    return getExercise(
      item.exerciseId
    );
  }

  function completeSet() {
    const session =
      state.activeWorkout;

    if (!session) return;

    const workout =
      getCurrentWorkout();

    const item =
      getCurrentExerciseItem();

    const exercise =
      getCurrentExerciseDefinition();

    if (!workout || !item || !exercise) {
      return;
    }

    const weight =
      Number(session.draft.weight);

    const reps =
      Number(session.draft.reps);

    const rpe =
      session.draft.rpe === ""
        ? null
        : Number(session.draft.rpe);

    if (
      !Number.isFinite(weight) ||
      weight < 0
    ) {
      toast("Informe uma carga válida.");
      return;
    }

    if (
      !Number.isFinite(reps) ||
      reps <= 0
    ) {
      toast("Informe as repetições.");
      return;
    }

    const completedAt =
      now();

    const setRecord = {
      id: uid("set"),

      exerciseId:
        exercise.id,

      exerciseName:
        exercise.name,

      category:
        exercise.category,

      setNumber:
        session.setIndex + 1,

      weight,

      reps,

      rpe,

      completedAt
    };

    session.completedSets.push(
      setRecord
    );

    session.lastInteractionAt =
      completedAt;

    updatePR(
      exercise.id,
      weight,
      reps,
      completedAt
    );

    session.draft = {
      weight: "",
      reps: "",
      rpe: ""
    };

    if (
      session.setIndex + 1 <
      item.sets
    ) {
      session.setIndex += 1;

      startRest(item.rest);

      saveState();

      render();

      return;
    }

    const previousExerciseIndex =
      session.exerciseIndex;

    const isLastRelevant =
      isLastRelevantExercise(
        workout,
        previousExerciseIndex
      );

    session.exerciseIndex += 1;

    session.setIndex = 0;

    session.rest = null;

    if (
      session.exerciseIndex >=
      workout.exercises.length
    ) {
      session.exerciseIndex =
        workout.exercises.length - 1;

      saveState();

      if (isLastRelevant) {
        maybeOfferWorkoutCompletion();
      }

      render();

      return;
    }

    saveState();

    render();

    toast(
      `Próximo: ${getCurrentExerciseDefinition()?.name || ""}`
    );
  }

  function isCardio(item) {
    const exercise =
      getExercise(item.exerciseId);

    return (
      exercise?.category === "Cardio" ||
      exercise?.type === "cardio"
    );
  }

  function isLastRelevantExercise(
    workout,
    index
  ) {
    const relevantIndexes =
      workout.exercises
        .map((item, i) => ({
          item,
          index: i
        }))
        .filter(
          entry =>
            !isCardio(entry.item)
        )
        .map(
          entry =>
            entry.index
        );

    if (!relevantIndexes.length) {
      return (
        index ===
        workout.exercises.length - 1
      );
    }

    return (
      index ===
      relevantIndexes[
        relevantIndexes.length - 1
      ]
    );
  }

  function skipExercise() {
    const session =
      state.activeWorkout;

    const workout =
      getCurrentWorkout();

    if (!session || !workout) return;

    const item =
      getCurrentExerciseItem();

    if (!item) return;

    session.skippedExercises.push({
      exerciseId: item.exerciseId,
      skippedAt: now()
    });

    session.exerciseIndex += 1;

    session.setIndex = 0;

    session.rest = null;

    if (
      session.exerciseIndex >=
      workout.exercises.length
    ) {
      session.exerciseIndex =
        workout.exercises.length - 1;

      saveState();

      maybeOfferWorkoutCompletion();

      return;
    }

    saveState();

    render();

    toast(
      `Exercício pulado. Próximo: ${getCurrentExerciseDefinition()?.name || ""}`
    );
  }

  function previousExercise() {
    const session =
      state.activeWorkout;

    if (!session) return;

    if (
      session.exerciseIndex <= 0
    ) {
      toast("Você já está no primeiro exercício.");
      return;
    }

    session.exerciseIndex -= 1;

    session.setIndex = 0;

    session.rest = null;

    session.lastInteractionAt =
      now();

    saveState();

    render();
  }

  function updatePR(
    exerciseId,
    weight,
    reps,
    timestamp
  ) {
    const current =
      state.prs[exerciseId];

    if (!current) {
      state.prs[exerciseId] = {
        exerciseId,
        weight,
        reps,
        achievedAt: timestamp
      };

      return;
    }

    const currentScore =
      current.weight *
      current.reps;

    const newScore =
      weight *
      reps;

    if (
      newScore >
      currentScore
    ) {
      state.prs[exerciseId] = {
        exerciseId,
        weight,
        reps,
        achievedAt: timestamp
      };
    }
  }

  function suggestedWeight(
    exerciseId
  ) {
    const pr =
      state.prs[exerciseId];

    if (!pr) return null;

    const increment =
      pr.weight < 20
        ? 2
        : 2;

    return pr.weight + increment;
  }

  /* =======================================================
     WORKOUT COMPLETION
     ======================================================= */

  function getLastRelevantCompletionTime() {
    const session =
      state.activeWorkout;

    if (!session) return null;

    const relevantSets =
      session.completedSets.filter(
        set => {
          const exercise =
            getExercise(
              set.exerciseId
            );

          return (
            exercise?.category !==
            "Cardio"
          );
        }
      );

    if (!relevantSets.length) {
      return null;
    }

    return Math.max(
      ...relevantSets.map(
        set =>
          set.completedAt
      )
    );
  }

  function maybeOfferWorkoutCompletion() {
    const session =
      state.activeWorkout;

    if (!session) return;

    const lastRelevant =
      getLastRelevantCompletionTime();

    const elapsedSinceLast =
      lastRelevant
        ? Math.floor(
            (
              now() -
              lastRelevant
            ) / 1000
          )
        : 0;

    if (
      elapsedSinceLast >= 180
    ) {
      openCompletionModal(
        elapsedSinceLast
      );

      return;
    }

    finishWorkout(
      now()
    );
  }

  function finishWorkout(
    finishTimestamp,
    useLastRelevant = false
  ) {
    const session =
      state.activeWorkout;

    if (!session) return;

    const workout =
      getCurrentWorkout();

    if (!workout) return;

    const lastRelevant =
      getLastRelevantCompletionTime();

    const finalTimestamp =
      useLastRelevant &&
      lastRelevant
        ? lastRelevant
        : finishTimestamp;

    const durationSeconds =
      Math.max(
        0,
        Math.floor(
          (
            finalTimestamp -
            session.startedAt
          ) / 1000
        )
      );

    const record = {
      id: session.id,

      workoutId:
        workout.id,

      workoutName:
        workout.name,

      startedAt:
        session.startedAt,

      finishedAt:
        finalTimestamp,

      durationSeconds,

      completedSets:
        clone(
          session.completedSets
        ),

      skippedExercises:
        clone(
          session.skippedExercises
        ),

      notes:
        session.notes || "",

      recordedAt:
        now()
    };

    state.history.unshift(record);

    state.activeWorkout = null;

    saveState();

    closeModal();

    navigate("history");

    toast("Treino registrado.");
  }

          }"
        >

          class="btn btn-secondary"
          data-action="close-modal"
        >

        >

        </button>

      </div>
    `);
  }

  function saveSetEdit(setId) {
    const session =
      state.activeWorkout;

    if (!session) return;

    const set =
      session.completedSets.find(
        item =>
          item.id === setId
      );

    if (!set) return;

    const weight =
      Number(
        document.getElementById(
          "editWeight"
        )?.value
      );

    const reps =
      Number(
        document.getElementById(
          "editReps"
        )?.value
      );

    const rpeRaw =
      document.getElementById(
        "editRpe"
      )?.value;

    const rpe =
      rpeRaw === ""
        ? null
        : Number(rpeRaw);

    if (
      !Number.isFinite(weight) ||
      !Number.isFinite(reps) ||
      reps <= 0
    ) {
      toast("Confira os dados.");
      return;
    }

    set.weight = weight;
    set.reps = reps;
    set.rpe = rpe;

    updatePR(
      set.exerciseId,
      weight,
      reps,
      set.completedAt
    );

    saveState();

    closeModal();

    render();

    toast("Série corrigida.");
  }

      id: uid("we"),

  function saveWorkout() {
    const draft =
      state.uiDrafts.workout;

    if (!draft) return;

    const name =
      document.getElementById(
        "newWorkoutName"
      )?.value.trim();

    const description =
      document.getElementById(
        "newWorkoutDescription"
      )?.value.trim();

    draft.name = name || "";
    draft.description =
      description || "";

    if (!draft.name) {
      toast("Dê um nome ao treino.");
      return;
    }

    if (!draft.exercises.length) {
      toast("Adicione pelo menos um exercício.");
      return;
    }

    const workout = {
      id: uid("workout"),
      name: draft.name,
      description: draft.description,
      preset: false,
      exercises:
        clone(draft.exercises)
    };

    state.workouts.push(workout);

    state.uiDrafts.workout = null;

    saveState();

    closeModal();

    render();

    toast("Treino criado.");
  }

  function saveTrainingSettings() {
    const executionMinutes =
      Number(
        document.getElementById(
          "executionMinutes"
        )?.value
      );

    const defaultRest =
      Number(
        document.getElementById(
          "defaultRest"
        )?.value
      );

    if (
      !Number.isFinite(
        executionMinutes
      ) ||
      executionMinutes < 0
    ) {
      toast("Tempo de execução inválido.");
      return;
    }

    if (
      !Number.isFinite(
        defaultRest
      ) ||
      defaultRest < 0
    ) {
      toast("Descanso inválido.");
      return;
    }

    state.settings.averageExecutionSeconds =
      Math.round(
        executionMinutes * 60
      );

    state.settings.defaultRestSeconds =
      Math.round(defaultRest);

    saveState();

    toast("Configurações salvas.");

    render();
  }

  function saveSchedule() {
    DAYS.forEach(day => {

      const select =
        document.querySelector(
          `[data-schedule-day="${day.id}"]`
        );

      if (select) {
        state.schedule[day.id] =
          select.value ||
          null;
      }

    });

    saveState();

    toast("Agenda atualizada.");

    render();
  }

              <div class="empty-title">
                Ainda não há PR registrado.
              </div>

              <div class="empty-copy">
                O primeiro registro aparecerá aqui.
              </div>
            </div>
          `
      }

      <div class="modal-actions">

        <button
          class="btn btn-secondary btn-block"
          data-action="close-modal"
        >
          Fechar
        </button>

      </div>
    `);
  }

  /* =======================================================
     EXPORT
     ======================================================= */

  function exportData() {
    const payload =
      JSON.stringify(
        state,
        null,
        2
      );

    const blob =
      new Blob(
        [payload],
        {
          type:
            "application/json"
        }
      );

    const url =
      URL.createObjectURL(
        blob
      );

    const a =
      document.createElement("a");

    a.href = url;

    a.download =
      "dabliu-fit-backup.json";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

    toast("Backup preparado.");
  }

  /* =======================================================
     RESET
     ======================================================= */

  function resetApp() {
    openConfirmModal(
      "Apagar todos os dados?",
      "Isso remove treinos, histórico, PRs, agenda e configurações locais.",
      [
        {
          label: "Cancelar",
          action: () => {
            closeModal();
          }
        },
        {
          label: "Apagar tudo",
          danger: true,
          action: () => {

            localStorage.removeItem(
              STORAGE_KEY
            );

            state =
              createInitialState();

            state.firstAccess =
              true;

            state.app.onboardingIndex =
              0;

            closeModal();

            render();

            toast("Dados apagados.");
          }
        }
      ]
    );
  }

  /* =======================================================
     EVENT HANDLERS
     ======================================================= */

  function handleAction(
    element
  ) {
    const action =
      element.dataset.action;

    if (!action) return;

    switch (action) {

      case "navigate":
        navigate(
          element.dataset.screen
        );
        break;

      case "navigate-import":
        state.app.screen =
          "import";

        state.app.importSource =
          null;

        saveState();

        render();
        break;

      case "resume-workout":
        navigate("workout");
        break;

      case "start-workout":
        closeModal();

        startWorkout(
          element.dataset.workoutId
        );
        break;

      case "skip-today":
        state.schedule[
          dayId()
        ] = null;

        saveState();

        toast(
          "Treino pulado hoje."
        );

        render();
        break;

      case "replace-today":
        openReplaceToday();
        break;

      case "library-tab":
        state.app.selectedLibrary =
          element.dataset.tab;

        saveState();

        render();
        break;

      case "exercise-category":
        state.app.libraryCategory =
          element.dataset.category;

        saveState();

        render();
        break;

      case "view-workout":
        viewWorkout(
          element.dataset.workoutId
        );
        break;

      case "create-workout":
        openCreateWorkout();
        break;

      case "add-workout-exercise":
        addWorkoutExercise();
        break;

      case "select-workout-exercise":
        selectWorkoutExercise(
          element.dataset.exerciseId
        );
        break;

      case "remove-draft-exercise":
        removeDraftExercise(
          Number(
            element.dataset.index
          )
        );
        break;

      case "save-workout":
        saveWorkout();
        break;

      case "complete-set":
        syncDraftInputs();
        completeSet();
        break;

      case "skip-exercise":
        skipExercise();
        break;

      case "previous-exercise":
        previousExercise();
        break;

      case "stop-rest":
        stopRest();
        break;

      case "add-rest":
        addRest(
          Number(
            element.dataset.seconds
          )
        );
        break;

      case "finish-manually":
        maybeOfferWorkoutCompletion();
        break;

      case "edit-set":
        editSet(
          element.dataset.setId
        );
        break;

      case "save-set-edit":
        saveSetEdit(
          element.dataset.setId
        );
        break;

      case "view-history":
        viewHistory(
          element.dataset.historyId
        );
        break;

      case "toggle-theme":

        state.settings.theme =
          state.settings.theme ===
          "dark"
            ? "light"
            : "dark";

        saveState();

        applyAppearance();

        render();

        break;

      case "set-accent":

        state.settings.accent =
          element.dataset.accent;

        saveState();

        applyAppearance();

        render();

        break;

      case "set-accent-onboarding":

        state.settings.accent =
          element.dataset.accent;

        saveState();

        applyAppearance();

        render();

        break;

      case "save-settings-training":
        saveTrainingSettings();
        break;

      case "save-schedule":
        saveSchedule();
        break;

      case "import-source":

        state.app.importSource =
          element.dataset.source;

        saveState();

        render();

        break;

      case "back-import":

        state.app.importSource =
          null;

        saveState();

        render();

        break;

      case "copy-prompt":
        copyImportPrompt();
        break;

      case "show-pr":
        showPR(
          element.dataset.exerciseId
        );
        break;

      case "export-data":
        exportData();
        break;

      case "reset-app":
        resetApp();
        break;

      case "close-modal":
        closeModal();
        break;

      case "close-modal-backdrop":
        closeModal();
        break;

      case "modal-custom": {

        const index =
          Number(
            element.dataset.index
          );

        const button =
          window.__modalButtons?.[
            index
          ];

        if (button) {
          button.action();
        }

        break;
      }

      case "finish-use-now":

        finishWorkout(
          now(),
          false
        );

        break;

      case "finish-use-last-set":

        finishWorkout(
          now(),
          true
        );

        break;

      case "next-onboarding":

        state.app.onboardingIndex =
          Math.min(
            onboardingSlides.length - 1,
            (
              state.app
                .onboardingIndex ||
              0
            ) + 1
          );

        saveState();

        render();

        break;

      case "previous-onboarding":

        state.app.onboardingIndex =
          Math.max(
            0,
            (
              state.app
                .onboardingIndex ||
              0
            ) - 1
          );

        saveState();

        render();

        break;

      case "finish-onboarding":

        state.firstAccess =
          false;

        state.app.screen =
          "home";

        saveState();

        render();

        break;

      default:
        break;
    }
  }

  /* =======================================================
     REPLACE TODAY
     ======================================================= */

  function openReplaceToday() {
    openModal(`
      <div class="modal-handle"></div>

      <div class="modal-title">
        Substituir treino de hoje
      </div>

      <p
        class="muted"
        style="margin-top:6px"
      >
        Escolha outro treino apenas para hoje.
        Sua agenda semanal não será alterada.
      </p>

      <div
        class="library-list"
        style="margin-top:15px"
      >

        ${state.workouts.map(
          workout => `
            <button
              class="source-card"
              style="width:100%;text-align:left"
              data-action="replace-with"
              data-workout-id="${
                workout.id
              }"
            >

              <div class="source-logo">
                ${workout.name
                  .slice(0,1)
                  .toUpperCase()}
              </div>

              <div>
                <div class="source-name">
                  ${escapeHTML(
                    workout.name
                  )}
                </div>

                <div class="source-description">
                  ${
                    workout.exercises.length
                  } exercícios
                </div>
              </div>

            </button>
          `
        ).join("")}

      </div>
    `);
  }

  /* =======================================================
     INPUT PERSISTENCE
     ======================================================= */

  function syncDraftInputs() {
    const session =
      state.activeWorkout;

    if (!session) return;

    const weight =
      document.getElementById(
        "weightInput"
      )?.value;

    const reps =
      document.getElementById(
        "repsInput"
      )?.value;

    const rpe =
      document.getElementById(
        "rpeInput"
      )?.value;

    if (
      weight !== undefined
    ) {
      session.draft.weight =
        weight;
    }

    if (
      reps !== undefined
    ) {
      session.draft.reps =
        reps;
    }

    if (
      rpe !== undefined
    ) {
      session.draft.rpe =
        rpe;
    }

    session.lastInteractionAt =
      now();

    saveState();
  }

  function bindInputs() {
    document
      .querySelectorAll(
        "[data-input]"
      )
      .forEach(
        input => {

          input.addEventListener(
            "input",
            () => {

              const type =
                input.dataset.input;

              if (
                type ===
                "exercise-search"
              ) {

                state.app.exerciseQuery =
                  input.value;

                saveState();

                return;
              }

              if (
                type === "weight" &&
                state.activeWorkout
              ) {
                state.activeWorkout
                  .draft.weight =
                    input.value;
              }

              if (
                type === "reps" &&
                state.activeWorkout
              ) {
                state.activeWorkout
                  .draft.reps =
                    input.value;
              }

              if (
                type === "rpe" &&
                state.activeWorkout
              ) {
                state.activeWorkout
                  .draft.rpe =
                    input.value;
              }

              if (
                type ===
                "session-notes" &&
                state.activeWorkout
              ) {
                state.activeWorkout
                  .notes =
                    input.value;
              }

              if (
                state.activeWorkout
              ) {
                state.activeWorkout
                  .lastInteractionAt =
                    now();
              }

              saveState();

            }
          );

        }
      );
  }

  /* =======================================================
     GLOBAL EVENTS
     ======================================================= */

  document.addEventListener(
    "click",
    event => {

      const actionElement =
        event.target.closest(
          "[data-action]"
        );

      if (!actionElement) return;

      handleAction(
        actionElement
      );
    }
  );

  document.addEventListener(
    "input",
    () => {
      bindInputs();
    }
  );

  /* =======================================================
     PAGE VISIBILITY
     ======================================================= */

  document.addEventListener(
    "visibilitychange",
    () => {

      /*
       * Crucial:
       * The timer does NOT depend on this event.
       *
       * This event only forces a save.
       *
       * When the user returns, the timers calculate:
       *
       * Date.now() - timestamp
       *
       * instead of assuming JavaScript continued running.
       */

      if (
        state.activeWorkout
      ) {

        state.activeWorkout
          .lastInteractionAt =
            now();

        saveState();

      }

    }
  );

  window.addEventListener(
    "pagehide",
    () => {

      if (
        state.activeWorkout
      ) {
        state.activeWorkout
          .lastInteractionAt =
            now();
      }

      saveState();
    }
  );

  window.addEventListener(
    "beforeunload",
    () => {
      saveState();
    }
  );

  /* =======================================================
     TIMER LOOP
     ======================================================= */

  let timerLoop = null;

  function startTimerLoop() {

    clearInterval(
      timerLoop
    );

    timerLoop =
      setInterval(
        () => {

          if (
            state.activeWorkout &&
            state.app.screen ===
              "workout"
          ) {

            const workoutTimer =
              document.getElementById(
                "workoutTimer"
              );

            if (workoutTimer) {
              workoutTimer.textContent =
                formatDuration(
                  workoutElapsedSeconds()
                );
            }

            const restTimer =
              document.getElementById(
                "restTimer"
              );

            if (
              restTimer &&
              state.activeWorkout.rest
            ) {

              restTimer.textContent =
                formatDuration(
                  restElapsedSeconds()
                );

            }

          }

        },
        500
      );
  }

  /* =======================================================
     RENDER
     ======================================================= */

  function render() {
    applyAppearance();

    const app =
      document.getElementById(
        "app"
      );

    if (!app) return;

    if (
      state.firstAccess
    ) {

      app.innerHTML =
        renderOnboarding();

      return;
    }

    if (
      state.app.screen ===
      "workout"
    ) {

      app.innerHTML = `
        <div class="app-shell">
          ${renderHeader()}
          <main class="main">
            ${renderWorkoutScreen()}
          </main>
        </div>
      `;

    } else {

      let content = "";

      switch (
        state.app.screen
      ) {

        case "library":
          content =
            renderLibrary();
          break;

        case "history":
          content =
            renderHistory();
          break;

        case "settings":
          content =
            renderSettings();
          break;

        case "import":
          content =
            renderImport();
          break;

        case "home":
        default:
          content =
            renderHome();
          break;
      }

      app.innerHTML = `
        <div class="app-shell">

          ${renderHeader()}

          <main class="main">
            ${content}
          </main>

        </div>
      `;
    }

    bindInputs();

    startTimerLoop();
  }

  /* =======================================================
     RECOVERY
     ======================================================= */

  function recoverInterruptedState() {

    /*
     * Nothing needs to "restart" the timer.
     *
     * The session already contains timestamps.
     *
     * The app simply renders the session again.
     */

    if (
      state.activeWorkout
    ) {

      /*
       * If the previous state was inside
       * the workout, restore it there.
       */

      state.app.screen =
        "workout";

      saveState();

    }
  }

  /* =======================================================
     INIT
     ======================================================= */

  function init() {

    recoverInterruptedState();

    applyAppearance();

    render();

    /*
     * Small safety persistence loop.
     * This is NOT used for timing.
     *
     * It only ensures state is periodically
     * persisted while the application is open.
     */

    setInterval(
      () => {
        saveState();
      },
      5000
    );
  }

  init();

})();
</script>
